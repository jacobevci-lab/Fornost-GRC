name: Close exposed dedicated QA sessions
on:
  push:
    branches: [fix/qa-session-cleanup-verification]
    paths: ['.github/workflows/qa-session-cleanup.yml']
permissions:
  contents: read
jobs:
  cleanup:
    # One-time diagnostic retry after production QA, limited to this incident branch.
    if: github.event.before == '3ac52e3f37673a384cdfa0733e8273fae1a9772a'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Revoke only the configured dedicated test identity's sessions
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          FORNOST_SMOKE_EMAIL: ${{ secrets.FORNOST_SMOKE_EMAIL }}
          FORNOST_SMOKE_PASSWORD: ${{ secrets.FORNOST_SMOKE_PASSWORD }}
        run: node scripts/qa-close-owned-sessions.mjs
