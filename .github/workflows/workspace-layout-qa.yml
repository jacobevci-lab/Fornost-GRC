name: Workspace Layout QA
on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/*qa*.mjs'
      - '.github/workflows/workspace-layout-qa.yml'
  workflow_dispatch:
concurrency:
  group: workspace-layout-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Use runner browser or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Start isolated app and create QA account
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY=" + require("crypto").randomBytes(32).toString("hex") + "\n")'
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/layout-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/api/auth \
            -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' \
            --data '{"action":"bootstrap","name":"QA Admin","email":"qa-admin@fornost.test","password":"Fornost-QA!2026-Branch"}'
      - name: Ask Fornost immediate post-login and recovery QA
        run: node scripts/ask-fornost-runtime-qa.mjs
      - name: Ready control templates and result drill-down QA
        run: node scripts/ready-controls-runtime-qa.mjs
      - name: Module boundaries, access editor and session revocation QA
        run: node scripts/module-access-runtime-qa.mjs
      - name: CAPA control context, diagnostics and recovery QA
        run: node scripts/capa-control-context-qa.mjs
      - name: Re-test recovery, independent approval and risk reconciliation QA
        run: node scripts/assurance-retest-runtime-qa.mjs
      - name: Scoped audit readiness, evidence and export QA
        run: node scripts/audit-readiness-runtime-qa.mjs
      - name: Check module layouts and audit stability
        run: node scripts/workspace-layout-qa.mjs
      - name: Core CRUD, forms, continuity and governance lifecycle QA
        run: node scripts/comprehensive-runtime-qa.mjs
      - name: Accessibility, localization and responsive product QA
        env:
          FORNOST_PROD_URL: http://127.0.0.1:4173
          FORNOST_SMOKE_EMAIL: qa-admin@fornost.test
          FORNOST_SMOKE_PASSWORD: Fornost-QA!2026-Branch
          CF_ACCESS_CLIENT_ID: local-qa
          CF_ACCESS_CLIENT_SECRET: local-qa
        run: node scripts/full-product-qa-gate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-layout-qa
          path: |
            ask-fornost-qa-artifacts/
            ready-controls-qa-artifacts/
            module-access-qa-artifacts/
            capa-control-qa-artifacts/
            assurance-retest-qa-artifacts/
            audit-readiness-qa-artifacts/
            layout-qa-artifacts/
            runtime-qa-artifacts/
            qa-artifacts-v2/
            /tmp/layout-runtime.log
