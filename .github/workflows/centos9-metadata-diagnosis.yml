name: CentOS 9 package repository diagnosis
on:
  push:
    branches: [diagnose/centos9-metadata-20261023]
permissions:
  contents: read
jobs:
  repository-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a6efe123becf93429fb098f484a23b2512e90308
      - name: Verify existing Python and run every original installer and backup test
        run: |
          docker run --rm --volume "$PWD:/src:ro" --workdir /src quay.io/centos/centos:stream9 bash -lc '
            set -e
            if ! command -v python3 >/dev/null 2>&1; then dnf -y install python3; fi
            python3 --version
            bash -n scripts/linux/*.sh tests/onprem-install-smoke.sh
            bash tests/onprem-install-smoke.sh
            python3 tests/onprem-backup-test.py
          '
