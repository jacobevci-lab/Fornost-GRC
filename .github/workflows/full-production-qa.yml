name: Full Production QA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fornost-full-production-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Browser, visual, accessibility, i18n and runtime QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORNOST_EXPECTED_REVISION: ${{ github.sha }}
      FORNOST_PROD_URL: ${{ vars.FORNOST_PROD_URL || 'https://app.fornostsecurity.com' }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      QA_FAIL_ON_HIGH: "1"

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Prepare temporary production QA account
        uses: ./.github/actions/production-qa-account
        with:
          token: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          account: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Install locked application dependencies
        run: npm ci

      - name: Install QA browser tooling
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.1

      - name: Use runner browser or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Verify the expected production revision
        run: node scripts/wait-for-production-revision.mjs

      - name: Check deployed local account lifecycle when identity management changes
        if: github.event_name == 'push'
        timeout-minutes: 5
        shell: bash
        run: |
          if ! git diff --quiet HEAD^ HEAD -- app/api/users/route.ts app/api/users/account-store.ts scripts/local-account-lifecycle-qa.mjs; then
            node scripts/local-account-lifecycle-qa.mjs --production
          fi

      - name: Verify sandboxed accessibility scanner
        run: node scripts/qa-accessibility-regression.mjs

      - name: Run legacy production QA baseline
        timeout-minutes: 10
        run: node scripts/full-production-qa.mjs

      - name: Connector setup outcomes with isolated transport
        run: node scripts/connector-setup-outcome-qa.mjs

      - name: Run bilingual full-product QA and production gate
        run: node scripts/full-product-qa-gate.mjs

      - name: Validate Connected GRC live-source graph
        shell: bash
        run: |
          args=()
          if ! git diff --quiet HEAD^ HEAD -- scripts/entra-connected-e2e.mjs scripts/entra-qa; then
            args+=(--verify-entra-incident)
          fi
          node scripts/connected-grc-production-qa.mjs "${args[@]}"

      - name: Confirm production revision after QA
        run: node scripts/wait-for-production-revision.mjs --once

      - name: Upload QA reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fornost-full-production-qa
          path: |
            qa-artifacts/
            qa-artifacts-v2/
            connector-setup-qa-artifacts/
          if-no-files-found: warn
          retention-days: 21
