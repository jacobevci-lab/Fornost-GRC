services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ciso_grc
      POSTGRES_USER: ciso_grc
      POSTGRES_PASSWORD: change-me
    ports: ['5432:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ciso_grc -d ciso_grc']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-development-only
      MINIO_ROOT_PASSWORD: replace-before-use
    ports: ['9000:9000', '9001:9001']
    volumes: [minio-data:/data]
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    env_file:
      - path: .env
        required: false
    ports: ['3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001/api/v1
    ports: ['3000:3000']
    depends_on: [api]
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
  minio-data:
