name: QA Source Sanitizer

on:
  push:
    branches:
      - qa/full-product-security-audit-2026-09-22
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: qa/full-product-security-audit-2026-09-22
          fetch-depth: 0
      - name: Remove private network example from client source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'placeholder="http://10.10.10.50:11434"'
          new = 'placeholder="https://ai-gateway.example.com/v1"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one private endpoint placeholder, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- app/page.tsx
      - name: Commit exact source sanitization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: remove private AI endpoint from client bundle"
          git push origin HEAD:qa/full-product-security-audit-2026-09-22
