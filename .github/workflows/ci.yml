name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Run dependency audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            audit_log="$(mktemp)"
            set +e
            timeout 90s npm audit --omit=dev --audit-level=high 2>&1 | tee "${audit_log}"
            audit_status=${PIPESTATUS[0]}
            set -e
            if [[ ${audit_status} -eq 0 ]]; then
              rm -f "${audit_log}"
              exit 0
            fi
            if grep -Eqi '503 Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN|socket hang up' "${audit_log}"; then
              rm -f "${audit_log}"
              if [[ ${attempt} -lt 3 ]]; then
                echo "Transient npm audit service failure; retrying (${attempt}/3)."
                sleep $((attempt * 5))
                continue
              fi
              echo "npm audit service remained unavailable after 3 attempts." >&2
              exit ${audit_status}
            fi
            rm -f "${audit_log}"
            exit ${audit_status}
          done
      - run: npm run validate:artifact

  onprem-container-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - name: Install Podman
        if: matrix.engine == 'podman'
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Run full on-prem integration
        run: >-
          sudo env
          FORNOST_INTEGRATION_TEST=1
          FORNOST_CONTAINER_ENGINE=${{ matrix.engine }}
          FORNOST_INTEGRATION_PORT=18443
          FORNOST_BUILD_LOCAL=true
          bash tests/onprem-container-integration.sh

  rhel-family-shell-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux:8
          - rockylinux:9
          - almalinux:8
          - almalinux:9
          - quay.io/centos/centos:stream9
          - quay.io/centos/centos:stream10
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer on ${{ matrix.image }}
        run: >-
          docker run --rm
          --volume "$PWD:/src:ro"
          --workdir /src
          "${{ matrix.image }}"
          bash -lc 'bash -n scripts/linux/*.sh tests/onprem-install-smoke.sh && bash tests/onprem-install-smoke.sh'
