name: CentOS 9 package repository diagnosis
on:
  push:
    branches: [diagnose/centos9-metadata-20261023]
permissions:
  contents: read
jobs:
  repository-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Revalidate official metalink metadata without weakening checksum verification
        run: |
          docker run --rm quay.io/centos/centos:stream9 bash -lc '
            sed -i "/^metalink=/s/\$/\&fornost_ci_refresh=$(date +%s)/" /etc/yum.repos.d/centos.repo
            dnf -v -y --refresh install python3
          '
