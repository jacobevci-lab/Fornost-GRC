name: Production D1 Migration

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan only or apply migrations to production D1"
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
      confirmation:
        description: "For apply, type exactly: fornost-grc-prod"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fornost-production-d1-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ inputs.operation }} production D1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate production confirmation
        if: ${{ inputs.operation == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${CONFIRMATION}" != "fornost-grc-prod" ]]; then
            echo "Apply blocked: confirmation must be exactly 'fornost-grc-prod'." >&2
            exit 64
          fi

      - name: Validate Cloudflare credentials are configured
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_D1_API_TOKEN" >&2
            exit 78
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "Missing GitHub Actions secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 78
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate migration coverage and conflicts
        run: node scripts/validate-d1-migrations.mjs

      - name: Show pending production migrations
        run: >-
          npx wrangler d1 migrations list fornost-grc-prod
          --remote
          --config wrangler.d1.jsonc

      - name: Apply production migrations
        if: ${{ inputs.operation == 'apply' }}
        run: >-
          npx wrangler d1 migrations apply fornost-grc-prod
          --remote
          --config wrangler.d1.jsonc

      - name: Verify production database after apply
        if: ${{ inputs.operation == 'apply' }}
        run: >-
          npx wrangler d1 execute fornost-grc-prod
          --remote
          --config wrangler.d1.jsonc
          --command "SELECT COUNT(*) AS user_table_count FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';"
