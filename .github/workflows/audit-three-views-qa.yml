name: Audit Three Views QA
on:
  pull_request:
    paths: ['app/audit*', 'app/api/audits/**', 'app/page.tsx', 'app/enterprise-core-references.ts', 'scripts/audit*', '.github/workflows/audit-three-views-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-three-views-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node scripts/prepare-local-qa.mjs
      - name: Start isolated runtime
        run: |
          node -e 'require("fs").writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY=" + require("crypto").randomBytes(32).toString("hex") + "\n")'
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/audit-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/api/auth -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' --data-binary @/tmp/fornost-qa-bootstrap.json
      - name: Three views and lifecycle browser QA
        run: node scripts/audit-three-views-qa.mjs
      - name: Preserve screenshots and QA result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-three-views-browser
          path: audit-three-views-qa-artifacts/
          retention-days: 7
