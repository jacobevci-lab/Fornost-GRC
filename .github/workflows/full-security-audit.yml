name: Full Security Audit

on:
  workflow_dispatch:
  push:
    branches:
      - qa/full-product-security-audit-2026-09-22
      - security/**

permissions:
  contents: read

concurrency:
  group: fornost-full-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-sca-sbom-iac:
    name: SAST, secrets, SCA, SBOM and IaC
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Prepare security artifact directories
        run: mkdir -p security-artifacts/{sast,secrets,sca,sbom,iac,static-policy}

      - name: TypeScript syntax and type coverage
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck > security-artifacts/sast/typecheck.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Fornost static security policy audit
        id: static_policy
        shell: bash
        run: |
          set +e
          node scripts/security-static-policy-audit.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: npm production dependency audit
        id: npm_audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > security-artifacts/sca/npm-audit.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install Semgrep
        run: python3 -m pip install --disable-pip-version-check semgrep

      - name: Semgrep OWASP and security audit
        id: semgrep
        shell: bash
        run: |
          set +e
          semgrep scan \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --exclude 'scripts/**/*.sh' \
            --json \
            --output security-artifacts/sast/semgrep.json \
            app worker scripts
          scan=$?
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('security-artifacts/sast/semgrep.json')
          data=json.loads(p.read_text())
          results=data.get('results',[])
          high=[r for r in results if str(r.get('extra',{}).get('severity','')).upper() in {'ERROR','CRITICAL','HIGH'}]
          errors=data.get('errors',[])
          partial=[]
          fatal=[]
          for err in errors:
            path=str(err.get('path') or '')
            kind=err.get('type')
            is_partial=isinstance(kind,list) and bool(kind) and kind[0]=='PartialParsing'
            if is_partial:
              partial.append(path)
            if is_partial or str(err.get('level','')).lower() in {'error','fatal'}:
              fatal.append({'path':path,'message':err.get('message'),'type':kind})
          summary={
            'results':len(results),
            'high':len(high),
            'scannerErrors':len(errors),
            'partialParsing':len(partial),
            'parserErrors':fatal,
            'coveragePolicy':'Semgrep parser errors fail closed. All TS/TSX is additionally gated by npm run typecheck; shell files are scanned by ShellCheck.',
          }
          pathlib.Path('security-artifacts/sast/semgrep-summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False))
          raise SystemExit(2 if high or errors else 0)
          PY
          policy=$?
          code=$scan
          if [ "$policy" -ne 0 ]; then code=$policy; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: ShellCheck shell SAST
        id: shellcheck
        shell: bash
        run: |
          set +e
          docker run --rm --entrypoint sh -v "$PWD:/repo" koalaman/shellcheck-alpine:stable \
            -c 'cd /repo/scripts/linux && shellcheck -x -f json1 ./*.sh' \
            > security-artifacts/sast/shellcheck.json
          scan=$?
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('security-artifacts/sast/shellcheck.json')
          try:
            raw=json.loads(p.read_text()) if p.exists() and p.stat().st_size else {'comments':[]}
          except Exception as exc:
            pathlib.Path('security-artifacts/sast/shellcheck-summary.json').write_text(json.dumps({'parseError':str(exc)},indent=2))
            raise SystemExit(2)
          comments=raw.get('comments',[]) if isinstance(raw,dict) else raw if isinstance(raw,list) else []
          errors=[x for x in comments if str(x.get('level','')).lower()=='error']
          warnings=[x for x in comments if str(x.get('level','')).lower()=='warning']
          info=[x for x in comments if str(x.get('level','')).lower() in {'info','style'}]
          pathlib.Path('security-artifacts/sast/shellcheck-summary.json').write_text(json.dumps({
            'findings':len(comments),'errors':len(errors),'warnings':len(warnings),'infoOrStyle':len(info)
          },indent=2))
          raise SystemExit(2 if errors else 0)
          PY
          policy=$?
          code=0
          # ShellCheck uses 1 for ordinary findings; our JSON severity gate above decides
          # whether those findings are release-blocking. Scanner/runtime errors (>1) fail closed.
          if [ "$scan" -gt 1 ]; then code=$scan; fi
          if [ "$policy" -ne 0 ]; then code=$policy; fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gitleaks secret scan
        id: gitleaks
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source=/repo --no-banner --redact \
            --report-format=json \
            --report-path=/repo/security-artifacts/secrets/gitleaks.json \
            --exit-code=2
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Trivy filesystem vulnerability and misconfiguration scan
        id: trivy
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" aquasec/trivy:latest fs \
            --scanners vuln,misconfig \
            --format json \
            --output /repo/security-artifacts/sca/trivy.json \
            --exit-code 2 \
            /repo
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Checkov IaC scan
        id: checkov
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" bridgecrew/checkov:latest \
            -d /repo \
            --framework dockerfile github_actions \
            --quiet \
            -o json > security-artifacts/iac/checkov.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate CycloneDX and SPDX SBOMs
        id: syft
        shell: bash
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" anchore/syft:latest dir:/repo \
            -o cyclonedx-json=/repo/security-artifacts/sbom/fornost.cdx.json \
            -o spdx-json=/repo/security-artifacts/sbom/fornost.spdx.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write static scan status
        if: always()
        shell: bash
        run: |
          cat > security-artifacts/static-scan-status.txt <<EOF
          typecheck=${{ steps.typecheck.outputs.exit_code }}
          static_policy=${{ steps.static_policy.outputs.exit_code }}
          npm_audit=${{ steps.npm_audit.outputs.exit_code }}
          semgrep=${{ steps.semgrep.outputs.exit_code }}
          shellcheck=${{ steps.shellcheck.outputs.exit_code }}
          gitleaks=${{ steps.gitleaks.outputs.exit_code }}
          trivy=${{ steps.trivy.outputs.exit_code }}
          checkov=${{ steps.checkov.outputs.exit_code }}
          syft=${{ steps.syft.outputs.exit_code }}
          EOF

      - name: Upload static security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fornost-static-security-audit
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce static security gate
        if: always()
        shell: bash
        run: |
          failed=0
          for code in \
            "${{ steps.typecheck.outputs.exit_code }}" \
            "${{ steps.static_policy.outputs.exit_code }}" \
            "${{ steps.npm_audit.outputs.exit_code }}" \
            "${{ steps.semgrep.outputs.exit_code }}" \
            "${{ steps.shellcheck.outputs.exit_code }}" \
            "${{ steps.gitleaks.outputs.exit_code }}" \
            "${{ steps.trivy.outputs.exit_code }}" \
            "${{ steps.checkov.outputs.exit_code }}" \
            "${{ steps.syft.outputs.exit_code }}"; do
            if [ "$code" != "0" ]; then failed=1; fi
          done
          exit "$failed"

  dast-owasp:
    name: Safe production DAST and OWASP runtime checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORNOST_PROD_URL: ${{ vars.FORNOST_PROD_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      FORNOST_SMOKE_EMAIL: ${{ secrets.FORNOST_SMOKE_EMAIL }}
      FORNOST_SMOKE_PASSWORD: ${{ secrets.FORNOST_SMOKE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Prepare DAST artifacts
        run: |
          mkdir -p security-artifacts/{runtime,zap}
          chmod 0777 security-artifacts/zap

      - name: Validate runtime audit syntax
        run: |
          node --check scripts/trace-fetch-polyfill.mjs
          node --check scripts/security-runtime-audit.mjs

      - name: Run safe authenticated OWASP runtime audit
        id: runtime_audit
        shell: bash
        run: |
          set +e
          node --import ./scripts/trace-fetch-polyfill.mjs scripts/security-runtime-audit.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: ZAP passive/baseline scan through Cloudflare Access
        id: zap
        shell: bash
        run: |
          set +e
          docker run --rm \
            --entrypoint sh \
            -e TARGET_URL="$FORNOST_PROD_URL" \
            -e CF_ACCESS_CLIENT_ID \
            -e CF_ACCESS_CLIENT_SECRET \
            -v "$PWD/security-artifacts/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            -lc '/zap/zap-baseline.py -t "$TARGET_URL" -a -m 3 -I -J zap-baseline.json -w zap-baseline.md -r zap-baseline.html -z "-config replacer.full_list\(0\).description=cf-access-id -config replacer.full_list\(0\).enabled=true -config replacer.full_list\(0\).matchtype=REQ_HEADER -config replacer.full_list\(0\).matchstr=CF-Access-Client-Id -config replacer.full_list\(0\).replacement=$CF_ACCESS_CLIENT_ID -config replacer.full_list\(1\).description=cf-access-secret -config replacer.full_list\(1\).enabled=true -config replacer.full_list\(1\).matchtype=REQ_HEADER -config replacer.full_list\(1\).matchstr=CF-Access-Client-Secret -config replacer.full_list\(1\).replacement=$CF_ACCESS_CLIENT_SECRET"'
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write DAST status
        if: always()
        shell: bash
        run: |
          cat > security-artifacts/dast-scan-status.txt <<EOF
          runtime_audit=${{ steps.runtime_audit.outputs.exit_code }}
          zap=${{ steps.zap.outputs.exit_code }}
          EOF

      - name: Upload DAST and OWASP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fornost-dast-owasp-audit
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce DAST security gate
        if: always()
        shell: bash
        run: |
          failed=0
          for code in "${{ steps.runtime_audit.outputs.exit_code }}" "${{ steps.zap.outputs.exit_code }}"; do
            if [ "$code" != "0" ]; then failed=1; fi
          done
          exit "$failed"

  isolated-active-dast:
    name: Isolated production-build API and active DAST
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FORNOST_PROD_URL: https://127.0.0.1:4173
      FORNOST_SMOKE_EMAIL: security-admin@fornost.test
      FORNOST_SMOKE_PASSWORD: Security-QA!2026-Isolated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start isolated HTTPS production artifact
        shell: bash
        run: |
          mkdir -p security-artifacts/{runtime,zap}
          chmod 0777 security-artifacts/zap
          scan_key="$(openssl rand -hex 32)"
          echo "::add-mask::$scan_key"
          echo "SCAN_BOOTSTRAP_TOKEN=$scan_key" >> "$GITHUB_ENV"
          node_modules/.bin/wrangler dev --config dist/server/wrangler.json \
            --ip 127.0.0.1 --port 4174 --local \
            --persist-to /tmp/fornost-security-data \
            --var "FORNOST_BOOTSTRAP_TOKEN:$scan_key" \
            --var "FORNOST_SETTINGS_ENCRYPTION_KEY:$scan_key" \
            --var "FORNOST_DEMO_MODE:false" \
            --show-interactive-dev-session=false > /tmp/security-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4174/api/auth >/dev/null; then break; fi
            sleep 2
          done
          mkdir -p /tmp/security-proxy
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=localhost' \
            -keyout /tmp/security-proxy/key.pem -out /tmp/security-proxy/cert.pem 2>/dev/null
          cat > /tmp/security-proxy/nginx.conf <<'NGINX'
          events {}
          http {
            server {
              listen 127.0.0.1:4173 ssl;
              ssl_certificate /scan/cert.pem;
              ssl_certificate_key /scan/key.pem;
              ssl_protocols TLSv1.2 TLSv1.3;
              server_tokens off;
              client_max_body_size 10m;
              location / {
                proxy_pass http://127.0.0.1:4174;
                proxy_http_version 1.1;
                # Match the shipped proxy: default request buffering is enabled.
                proxy_set_header Host $http_host;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Proto $scheme;
              }
            }
          }
          NGINX
          docker run -d --name security-proxy --network host \
            -v /tmp/security-proxy:/scan:ro nginx:stable-alpine nginx -c /scan/nginx.conf -g 'daemon off;'
          for attempt in $(seq 1 30); do
            if curl --insecure --fail --silent https://127.0.0.1:4173/api/auth >/dev/null; then break; fi
            sleep 1
          done
          curl --insecure --fail --silent https://127.0.0.1:4173/api/auth >/dev/null
      - name: Bootstrap synthetic security account
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: node scripts/security-isolated-bootstrap.mjs
      - name: Authenticated OWASP API checks
        id: runtime
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        shell: bash
        run: |
          set +e
          node --import ./scripts/trace-fetch-polyfill.mjs scripts/security-runtime-audit.mjs
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Full API inventory authorization and CSRF matrix
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: node scripts/security-api-matrix.mjs
      - name: Browser CSP and hydration checks
        id: browser
        shell: bash
        run: |
          npm install --no-save --ignore-scripts @playwright/test@1.55.0
          export QA_CHROMIUM_PATH="$(command -v google-chrome)"
          node scripts/security-browser-qa.mjs
      - name: Active ZAP scan against disposable target only
        id: zap
        shell: bash
        run: |
          set +e
          timeout 20m docker run --rm --network host \
            -v "$PWD/security-artifacts/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py \
            -t https://127.0.0.1:4173 -m 2 -T 15 \
            -J zap-active.json -r zap-active.html -w zap-active.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Upload isolated security evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fornost-isolated-active-security
          path: |
            security-artifacts/
            /tmp/security-runtime.log
          retention-days: 30
      - name: Enforce isolated scan completion
        if: always()
        env:
          RUNTIME_EXIT: ${{ steps.runtime.outputs.exit_code }}
          ZAP_EXIT: ${{ steps.zap.outputs.exit_code }}
        run: |
          test "$RUNTIME_EXIT" = 0
          # ZAP 1/2 are findings, not scanner failures; retain and triage the report.
          test "$ZAP_EXIT" = 0 -o "$ZAP_EXIT" = 1 -o "$ZAP_EXIT" = 2
          test -s security-artifacts/zap/zap-active.json
          node scripts/security-zap-gate.mjs security-artifacts/zap/zap-active.json

  onprem-image-security:
    name: Deployable image vulnerabilities and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact revision's on-prem image
        run: docker build --build-arg FORNOST_SOURCE_COMMIT="$GITHUB_SHA" -t fornost-security:scan .
      - name: Export immutable scan input
        run: |
          mkdir -p security-artifacts/image
          docker image inspect fornost-security:scan --format '{{.Id}}' > security-artifacts/image/image-id.txt
          docker save fornost-security:scan -o /tmp/fornost-security-image.tar
      - name: Scan OS and application packages including unfixed CVEs
        run: |
          docker run --rm -v /tmp/fornost-security-image.tar:/scan/image.tar:ro \
            -v "$PWD/security-artifacts/image:/out" aquasec/trivy:latest image \
            --input /scan/image.tar --scanners vuln --format json --output /out/trivy-image.json
      - name: Generate deployable-image CycloneDX and SPDX
        run: |
          docker run --rm -v /tmp/fornost-security-image.tar:/scan/image.tar:ro \
            -v "$PWD/security-artifacts/image:/out" anchore/syft:latest docker-archive:/scan/image.tar \
            -o cyclonedx-json=/out/image.cdx.json -o spdx-json=/out/image.spdx.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fornost-image-security-sbom
          path: security-artifacts/image/
          retention-days: 30
      - name: Report image release blockers
        run: |
          python3 - <<'PY'
          import json
          data=json.load(open('security-artifacts/image/trivy-image.json'))
          findings=[v for result in data.get('Results',[]) for v in result.get('Vulnerabilities',[])]
          high=[v for v in findings if v.get('Severity') in ('HIGH','CRITICAL')]
          print('IMAGE_SECURITY_SUMMARY',json.dumps({'total':len(findings),'highCritical':len(high),'fixableHighCritical':sum(bool(v.get('FixedVersion')) for v in high)}))
          for v in high: print(v['VulnerabilityID'],v['PkgName'],v['InstalledVersion'],v.get('FixedVersion','unfixed'))
          raise SystemExit(2 if high else 0)
          PY
