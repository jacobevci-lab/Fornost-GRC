name: Production Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: fornost-production-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify production runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORNOST_PROD_URL: ${{ vars.FORNOST_PROD_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      FORNOST_SMOKE_EMAIL: ${{ secrets.FORNOST_SMOKE_EMAIL }}
      FORNOST_SMOKE_PASSWORD: ${{ secrets.FORNOST_SMOKE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Wait for production deployment after push
        if: ${{ github.event_name == 'push' }}
        run: sleep 75

      - name: Run production smoke tests
        run: node scripts/production-smoke-test.mjs
