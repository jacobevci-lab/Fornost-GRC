name: Audit workspace release QA

on:
  pull_request:
    paths:
      - 'app/audit*'
      - 'app/api/audits/**'
      - 'app/page.tsx'
      - 'scripts/*audit*'
      - 'scripts/research-workspace-qa.mjs'
      - '.github/workflows/audit-workspace-release-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-workspace-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - area: workspace
            scripts: audit-management-qa research-workspace-qa audit-requirement-page-qa framework-packs-qa audit-plan-qa audit-milestones-qa
          - area: workpapers
            scripts: audit-workpapers-qa workpaper-random-sampling-qa milestone-review-qa audit-template-library-qa
          - area: requests
            scripts: audit-request-workflow-qa audit-reminder-profile-qa audit-shared-calendar-qa audit-status-report-qa audit-closure-qa
          - area: assurance
            scripts: audit-readiness-runtime-qa current-assessment-runtime-qa assurance-work-focus-qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Use runner browser or install Chromium
        run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Generate isolated QA credentials
        run: node scripts/prepare-local-qa.mjs
      - name: Start isolated runtime
        run: |
          node -e 'require("fs").writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY=" + require("crypto").randomBytes(32).toString("hex") + "\n")'
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/audit-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/api/auth \
            -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' \
            --data-binary @/tmp/fornost-qa-bootstrap.json
      - name: Verify audit workflows
        env:
          QA_SCRIPTS: ${{ matrix.scripts }}
        run: |
          for script in $QA_SCRIPTS; do
            node "scripts/$script.mjs"
          done
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-release-${{ matrix.area }}
          path: |
            *-qa-artifacts/
            /tmp/audit-runtime.log
