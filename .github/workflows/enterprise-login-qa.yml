name: Enterprise Login QA
on:
  workflow_dispatch:
  pull_request:
    paths: ['app/authentication/**', 'app/api/auth/**', 'app/api/users/**', 'app/identity-profile-panel.tsx', 'app/local-auth-submit.ts', 'services/identity-bridge/**', 'scripts/enterprise-login-qa.mjs', 'scripts/session-startup-qa.mjs', 'tests/authentication-*', '.github/workflows/enterprise-login-qa.yml']
permissions:
  contents: read
concurrency:
  group: enterprise-login-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  browser-and-protocols:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/identity-bridge
      - run: npm test --prefix services/identity-bridge
      - run: npm audit --prefix services/identity-bridge --omit=dev --audit-level=high
      - run: node --import tsx --test tests/authentication-*.test.ts
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0
      - name: Browser
        run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - run: node scripts/prepare-local-qa.mjs
      - name: Isolated secrets
        run: node --input-type=module -e 'import {randomBytes} from "node:crypto"; import {writeFileSync} from "node:fs"; writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY="+randomBytes(32).toString("hex")+"\nFORNOST_IDENTITY_BRIDGE_TOKEN="+randomBytes(32).toString("hex")+"\n", {mode:0o600});'
      - name: Verify login, configuration, audit and recovery
        run: |
          set -euo pipefail
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/enterprise-login-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:4173' --data-binary @/tmp/fornost-qa-bootstrap.json http://127.0.0.1:4173/api/auth >/tmp/enterprise-bootstrap.json
          node scripts/enterprise-login-qa.mjs
          node scripts/local-login-recovery-qa.mjs
          node scripts/session-startup-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enterprise-login-qa
          path: enterprise-login-qa-artifacts/
