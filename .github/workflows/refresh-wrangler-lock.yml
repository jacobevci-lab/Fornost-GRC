name: Refresh Wrangler lockfile

on:
  push:
    branches:
      - feat/attention-capa-governance-bridge
    paths:
      - .github/workflows/refresh-wrangler-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/attention-capa-governance-bridge
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Refresh exact Wrangler dependency and lockfile
        run: npm install wrangler@4.144.0 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated dependency metadata
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency metadata changes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: update wrangler to 4.144.0"
          git push origin HEAD:feat/attention-capa-governance-bridge
