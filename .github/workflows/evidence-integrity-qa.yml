name: Evidence integrity QA
on:
  pull_request:
    paths:
      - 'app/api/evidence/**'
      - 'app/evidence/**'
      - 'app/record-code-store.ts'
      - 'app/evidence-history-panel.tsx'
      - 'scripts/evidence-integrity-fix-qa.mjs'
      - '.github/workflows/evidence-integrity-qa.yml'
  push:
    branches: [main]
    paths:
      - 'app/api/evidence/**'
      - 'app/evidence/**'
      - 'app/record-code-store.ts'
      - 'app/evidence-history-panel.tsx'
      - 'scripts/evidence-integrity-fix-qa.mjs'
      - '.github/workflows/evidence-integrity-qa.yml'
permissions:
  contents: read
jobs:
  isolated:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_CF_FETCH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0
      - name: Browser
        run: echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node scripts/prepare-local-qa.mjs
      - name: Browser and actual upload regression
        run: |
          set -euo pipefail
          node -e 'require("fs").writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY=" + require("crypto").randomBytes(32).toString("hex") + "\n", {mode:0o600})'
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/evidence-runtime.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/api/auth > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:4173' --data-binary @/tmp/fornost-qa-bootstrap.json http://127.0.0.1:4173/api/auth > /tmp/evidence-bootstrap.json
          node scripts/seed-local-qa.mjs
          node scripts/evidence-integrity-fix-qa.mjs
          node scripts/evidence-document-formats-qa.mjs
          node scripts/module-access-runtime-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-integrity-isolated
          path: |
            evidence-integrity-qa-artifacts/
            evidence-formats-qa-artifacts/
            module-access-qa-artifacts/
  production:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORNOST_EXPECTED_REVISION: ${{ github.sha }}
      FORNOST_PROD_URL: https://app.fornostsecurity.com
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      FORNOST_SMOKE_EMAIL: ${{ secrets.FORNOST_SMOKE_EMAIL }}
      FORNOST_SMOKE_PASSWORD: ${{ secrets.FORNOST_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0
      - name: Browser
        run: echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: node scripts/wait-for-production-revision.mjs
      - run: node scripts/evidence-integrity-fix-qa.mjs --production
      - run: node scripts/wait-for-production-revision.mjs --once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-integrity-production
          path: evidence-integrity-qa-artifacts/
