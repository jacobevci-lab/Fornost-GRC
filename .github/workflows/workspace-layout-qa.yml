name: Workspace Layout QA
on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/*qa*.mjs'
      - '.github/workflows/workspace-layout-qa.yml'
  workflow_dispatch:
concurrency:
  group: workspace-layout-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Use runner browser or install Chromium
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            echo "QA_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Production browser harness isolation and readiness regression
        run: node scripts/qa-browser-harness-regression.mjs
      - name: KRI form interaction regression
        run: node scripts/kri-form-interactions-qa.mjs
      - name: Generate isolated QA credentials
        run: node scripts/prepare-local-qa.mjs
      - name: Start isolated app and create QA account
        shell: bash
        run: |
          node -e 'require("fs").writeFileSync(".dev.vars", "FORNOST_SETTINGS_ENCRYPTION_KEY=" + require("crypto").randomBytes(32).toString("hex") + "\n")'
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/layout-runtime.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/api/auth \
            -H 'Origin: http://127.0.0.1:4173' -H 'Content-Type: application/json' \
            --data-binary @/tmp/fornost-qa-bootstrap.json
      - name: Connected evidence selection and directory assignment QA
        timeout-minutes: 7
        run: node scripts/workflow-evidence-selection-qa.mjs
      - name: Preserve connected evidence selection browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evidence-selection-preview
          path: workflow-evidence-selection-qa-artifacts/
      - name: Workflow decision evidence usage and exact source recovery QA
        timeout-minutes: 6
        run: node scripts/workflow-evidence-usage-qa.mjs
      - name: Preserve workflow evidence usage browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-evidence-usage-preview
          path: workflow-evidence-usage-qa-artifacts/
          if-no-files-found: warn
      - name: Continuity assignments and lifecycle in My Work QA
        timeout-minutes: 6
        run: node scripts/continuity-my-work-qa.mjs
      - name: Preserve continuity inbox browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-my-work-preview
          path: continuity-my-work-qa-artifacts/
          if-no-files-found: warn
      - name: Periodic continuity plan review and retained history QA
        timeout-minutes: 6
        run: node scripts/continuity-plan-review-qa.mjs
      - name: Preserve continuity plan review browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-plan-review-preview
          path: continuity-plan-review-qa-artifacts/
          if-no-files-found: warn
      - name: Register XLSX preview, validation and retry-safe import QA
        timeout-minutes: 6
        run: node scripts/register-import-qa.mjs
      - name: Preserve register import browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-import-preview
          path: register-import-qa-artifacts/
      - name: Live product QA fixes regression
        run: node scripts/live-product-fixes-qa.mjs
      - name: Preserve live product fixes browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-product-fixes-preview
          path: live-product-fixes-qa-artifacts/
      - name: Product experience recovery, form guidance and navigation QA
        run: node scripts/product-experience-qa.mjs
      - name: Preserve product experience browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-experience-preview
          path: product-experience-qa-artifacts/
      - name: Enterprise reporting HTML PDF CSV QA
        run: node scripts/reporting-export-qa.mjs
      - name: Register and work queue sorting, saved order and exports QA
        run: node scripts/register-sorting-qa.mjs
      - name: Preserve register sorting browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: register-sorting-preview
          path: register-sorting-qa-artifacts/
      - name: Preserve report export browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporting-export-preview
          path: layout-qa-artifacts/
      - name: Integration and evidence read timeout, cancellation and recovery QA
        run: node scripts/integration-read-recovery-qa.mjs
      - name: Preserve integration read recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-read-recovery-preview
          path: integration-read-recovery-qa-artifacts/
      - name: Administration settings status and recovery QA
        run: node scripts/admin-settings-runtime-qa.mjs
      - name: Publish administration and email settings browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: admin-settings-preview
          path: admin-settings-qa-artifacts/
      - name: Superseded copilot identity response and authorization QA
        run: node scripts/copilot-identity-response-qa.mjs
      - name: Preserve copilot identity response evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-identity-response-preview
          path: copilot-identity-response-qa-artifacts/
      - name: Task pack working-day planning and atomic recovery QA
        run: node scripts/audit-task-pack-deadline-qa.mjs
      - name: Preserve task pack calendar browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-task-pack-deadline-preview
          path: audit-task-pack-deadline-qa-artifacts/
      - name: Working-day deadline preview, calendar conflict and authorization QA
        run: node scripts/audit-deadline-adjustment-qa.mjs
      - name: Preserve working-day deadline browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-deadline-adjustment-preview
          path: audit-deadline-adjustment-qa-artifacts/
      - name: Request deadline planning, independent return and draft recovery QA
        run: node scripts/audit-request-deadline-qa.mjs
      - name: Preserve request deadline browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-request-deadline-preview
          path: audit-request-deadline-qa-artifacts/
      - name: Evidence change follow-up, conflict recovery and origin QA
        run: node scripts/evidence-change-followup-qa.mjs
      - name: Preserve evidence change follow-up browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-change-followup-preview
          path: evidence-change-followup-qa-artifacts/
      - name: Evidence usage, pinned versions and scoped navigation QA
        run: node scripts/evidence-usage-qa.mjs
      - name: Preserve evidence usage browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-usage-preview
          path: evidence-usage-qa-artifacts/
      - name: Reproducible random sampling and independent review QA
        run: node scripts/workpaper-random-sampling-qa.mjs
      - name: Preserve random sampling browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workpaper-random-sampling-preview
          path: workpaper-random-sampling-qa-artifacts/
      - name: Workpaper exception to canonical CAPA and origin QA
        run: node scripts/workpaper-capa-qa.mjs
      - name: Preserve workpaper CAPA browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workpaper-capa-preview
          path: workpaper-capa-qa-artifacts/
      - name: Shared calendar versions, explicit adoption and conflict QA
        run: node scripts/audit-shared-calendar-qa.mjs
      - name: Preserve shared calendar browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-shared-calendar-preview
          path: audit-shared-calendar-qa-artifacts/
      - name: Independent milestone review, handoff and decision QA
        run: node scripts/milestone-review-qa.mjs
      - name: Preserve milestone review browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milestone-review-preview
          path: milestone-review-qa-artifacts/
      - name: Account and team views, version restore and permission QA
        run: node scripts/account-views-qa.mjs
      - name: Preserve account view browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: account-views-preview
          path: account-views-qa-artifacts/
      - name: Personal saved register views and account isolation QA
        run: node scripts/saved-register-views-qa.mjs
      - name: Preserve saved view browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-register-views-preview
          path: saved-register-views-qa-artifacts/
      - name: My Work assurance assignment and recovery QA
        run: node scripts/my-work-assurance-runtime-qa.mjs
      - name: Preserve My Work module filter and recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: my-work-module-preview
          path: my-work-assurance-qa-artifacts/
      - name: Shared record links, sign-in and email task URL QA
        run: node scripts/record-links-qa.mjs
      - name: Publish record link browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-links-preview
          path: record-links-qa-artifacts/
      - name: Audit workpapers, sampling and independent review QA
        run: node scripts/audit-workpapers-qa.mjs
      - name: Shared audit template library, versioning and reuse QA
        run: node scripts/audit-template-library-qa.mjs
      - name: Preserve shared template library evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-template-library-preview
          path: audit-template-library-qa-artifacts/
      - name: Audit milestones and My Work browser QA
        run: node scripts/audit-milestones-qa.mjs
      - name: Preserve audit milestone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-milestones-preview
          path: audit-milestones-qa-artifacts/
          if-no-files-found: warn
      - name: Publish workpaper browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-workpapers-preview
          path: audit-workpapers-qa-artifacts/
      - name: Connected AI graph and source recovery QA
        run: node scripts/connected-ai-grc-qa.mjs
      - name: Publish connected source recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-source-preview
          path: connected-ai-qa-artifacts/
      - name: Audit reminder calendar, escalation and conflict recovery QA
        run: node scripts/audit-reminder-profile-qa.mjs
      - name: Publish reminder profile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reminder-preview
          path: audit-reminder-qa-artifacts/
      - name: Audit evidence request lifecycle and reminders QA
        run: node scripts/audit-request-workflow-qa.mjs
      - name: Audit status report snapshots, scope and exports QA
        run: node scripts/audit-status-report-qa.mjs
      - name: Whole audit independent approval closure and reopening QA
        run: node scripts/audit-closure-qa.mjs
      - name: Publish audit closure browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-closure-preview
          path: audit-closure-qa-artifacts/
      - name: Authorized record search, exact navigation and register context QA
        run: node scripts/record-search-qa.mjs
      - name: Publish record search browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: record-search-preview
          path: record-search-qa-artifacts/
      - name: Full visible navigation, record save race and audit orphan recovery QA
        run: node scripts/full-browser-qa-regression.mjs
      - name: Enterprise My Work lifecycle navigation and recovery QA
        run: node scripts/enterprise-work-runtime-qa.mjs
      - name: Research workspaces, contextual evidence preview and tab navigation QA
        run: node scripts/research-workspace-qa.mjs
      - name: Publish focused workspace screenshots for early visual review
        uses: actions/upload-artifact@v4
        with:
          name: research-workspace-preview
          path: research-workspace-qa-artifacts/

      - name: Visual hierarchy, work filters and vendor recovery QA
        run: node scripts/visual-workspace-qa.mjs
      - name: Findings workspace recovery and pagination
        run: node scripts/findings-workspace-qa.mjs
      - name: Assurance execution consistency and conflict recovery QA
        run: node scripts/assurance-execution-qa.mjs
      - name: Concurrent cold and warm schema initialization QA
        run: node scripts/schema-initialization-qa.mjs
      - name: Exact assurance work focus, permissions and stale response QA
        run: node scripts/assurance-work-focus-qa.mjs
      - name: Historical run result, evidence navigation and recovery QA
        run: node scripts/control-run-detail-qa.mjs
      - name: Scoped audit readiness, evidence and export QA
        run: node scripts/audit-readiness-runtime-qa.mjs
      - name: Current assessment projection, audit and control QA
        run: node scripts/current-assessment-runtime-qa.mjs
      - name: Enterprise reference deletion runtime QA
        run: node scripts/enterprise-reference-delete-qa.mjs
      - name: Record dialog themes and Escape QA
        run: node scripts/record-dialog-qa.mjs
      - name: Platform-wide Escape dismissal QA
        run: node scripts/platform-escape-qa.mjs
      - name: Connected assurance chain review and recovery QA
        run: node scripts/assurance-chain-review-qa.mjs
      - name: Exact CAPA lifecycle lookup and recovery QA
        run: node scripts/capa-traceability-qa.mjs
      - name: Assurance queue recovery and independent review QA
        run: node scripts/assurance-queue-recovery-qa.mjs
      - name: Audit requirement pagination and export QA
        run: node scripts/audit-requirement-page-qa.mjs
      - name: Local login write and recovery QA
        run: node scripts/local-login-recovery-qa.mjs
      - name: Session startup timeout and stale-response QA
        run: node scripts/session-startup-qa.mjs
      - name: Audit readiness delayed-response stability QA
        run: node scripts/audit-readiness-stability-qa.mjs
      - name: Full framework catalogs and large audit QA
        run: node scripts/framework-packs-qa.mjs
      - name: Audit engagement planning QA
        run: node scripts/audit-plan-qa.mjs
      - name: Evidence document formats, downloads and version approval QA
        run: node scripts/evidence-document-formats-qa.mjs
      - name: Atomic AI retirement and independent verification QA
        run: node scripts/ai-retirement-atomic-qa.mjs
      - name: AI model lifecycle and stale decision QA
        run: node scripts/ai-model-lifecycle-qa.mjs
      - name: Workspace simplicity flows
        run: node scripts/workspace-simplicity-qa.mjs
      - name: AI exact record navigation and recovery QA
        run: node scripts/ai-record-navigation-qa.mjs
      - name: Assurance follow-up search, pagination and recovery QA
        run: node scripts/assurance-followup-workspace-qa.mjs
      - name: Control business impact and dependency navigation QA
        run: node scripts/control-business-impact-qa.mjs
      - name: Connected reference ambiguity and correction QA
        run: node scripts/connected-reference-integrity-qa.mjs
      - name: User session revocation and identity load recovery QA
        run: node scripts/user-session-revocation-qa.mjs
      - name: Server session lifetime and sign-in recovery QA
        run: node scripts/session-policy-runtime-qa.mjs
      - name: Ask Fornost immediate post-login and recovery QA
        run: node scripts/ask-fornost-runtime-qa.mjs
      - name: Ready control templates and result drill-down QA
        run: node scripts/ready-controls-runtime-qa.mjs
      - name: Connected GRC live sources and explorer contract
        env:
          FORNOST_PROD_URL: http://127.0.0.1:4173
          FORNOST_SMOKE_EMAIL: qa-admin@fornost.test
        run: node scripts/connected-grc-production-qa.mjs
      - name: Module boundaries, access editor and session revocation QA
        run: node scripts/module-access-runtime-qa.mjs
      - name: CAPA control context, diagnostics and recovery QA
        run: node scripts/capa-control-context-qa.mjs
      - name: Re-test recovery, independent approval and risk reconciliation QA
        run: node scripts/assurance-retest-runtime-qa.mjs
      - name: Versioned risk decisions, independent approval and conflict recovery QA
        run: node scripts/risk-decisions-runtime-qa.mjs
      - name: Atomic exception decisions, expiration and rollback QA
        run: node scripts/exception-lifecycle-runtime-qa.mjs
      - name: Unified control assurance, record navigation and recovery QA
        run: node scripts/control-assurance-runtime-qa.mjs
      - name: Check module layouts and audit stability
        run: node scripts/workspace-layout-qa.mjs
      - name: Core CRUD, forms, continuity and governance lifecycle QA
        timeout-minutes: 8
        run: node scripts/comprehensive-runtime-qa.mjs
      - name: Accessibility, localization and responsive product QA
        env:
          FORNOST_PROD_URL: http://127.0.0.1:4173
          FORNOST_SMOKE_EMAIL: qa-admin@fornost.test
          CF_ACCESS_CLIENT_ID: local-qa
          CF_ACCESS_CLIENT_SECRET: local-qa
        run: node scripts/full-product-qa-gate.mjs
      - name: Preserve failure evidence before the visual matrix
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: workspace-layout-failure
          path: |
            *-qa-artifacts/
            full-browser-regression-artifacts/
            qa-artifacts/
            qa-artifacts-v2/
          if-no-files-found: warn
      - name: Every module in both languages and themes at desktop tablet and mobile widths
        if: ${{ !cancelled() }}
        run: node scripts/enterprise-ui-matrix-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-layout-qa
          path: |
            visual-workspace-qa-artifacts/
            research-workspace-qa-artifacts/
            findings-workspace-qa-artifacts/
            record-dialog-qa-artifacts/
            full-browser-regression-artifacts/
            enterprise-ui-matrix-artifacts/
            ai-retirement-qa-artifacts/
            ai-model-lifecycle-qa-artifacts/
            ai-record-navigation-qa-artifacts/
            connected-ai-qa-artifacts/
            control-business-impact-qa-artifacts/
            enterprise-work-qa-artifacts/
            connected-reference-qa-artifacts/
            user-session-revocation-qa-artifacts/
            session-policy-qa-artifacts/
            admin-settings-qa-artifacts/
            simplicity-qa-artifacts/
            ask-fornost-qa-artifacts/
            ready-controls-qa-artifacts/
            assurance-execution-qa-artifacts/
            assurance-work-focus-qa-artifacts/
            control-run-detail-qa-artifacts/
            current-assessment-qa-artifacts/
            my-work-assurance-qa-artifacts/
            module-access-qa-artifacts/
            capa-control-qa-artifacts/
            assurance-retest-qa-artifacts/
            audit-readiness-qa-artifacts/
            audit-request-qa-artifacts/
            audit-status-report-qa-artifacts/
            evidence-formats-qa-artifacts/
            control-assurance-qa-artifacts/
            risk-decisions-qa-artifacts/
            exception-lifecycle-qa-artifacts/
            layout-qa-artifacts/
            runtime-qa-artifacts/
            qa-artifacts-v2/
            /tmp/layout-runtime.log
