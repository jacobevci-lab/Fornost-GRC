name: Administration account cleanup
on:
  push:
    branches: [feature/admin-consistency, main]
    paths: ['scripts/admin-account-cleanup.mjs', 'scripts/production-account-store.mjs', '.github/workflows/admin-account-cleanup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fornost-admin-account-cleanup
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read exact account inventory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/admin-account-cleanup.mjs
      - name: Wait for the released revision
        if: github.ref == 'refs/heads/main'
        env:
          FORNOST_EXPECTED_REVISION: ${{ github.sha }}
          FORNOST_PROD_URL: https://app.fornostsecurity.com
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: node scripts/wait-for-production-revision.mjs
      - name: Remove only the four user-named accounts and verify the retained administrator
        if: github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRMATION: remove-four-named-test-accounts
        run: node scripts/admin-account-cleanup.mjs --apply
