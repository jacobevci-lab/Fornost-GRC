name: Full Production QA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fornost-full-production-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: Browser, visual, accessibility, i18n and runtime QA
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORNOST_PROD_URL: ${{ vars.FORNOST_PROD_URL }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      FORNOST_SMOKE_EMAIL: ${{ secrets.FORNOST_SMOKE_EMAIL }}
      FORNOST_SMOKE_PASSWORD: ${{ secrets.FORNOST_SMOKE_PASSWORD }}
      QA_FAIL_ON_HIGH: "1"

    steps:
      - name: Checkout deployed revision
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked application dependencies
        run: npm ci

      - name: Install QA browser tooling
        run: npm install --no-save --ignore-scripts @playwright/test@1.55.0 @axe-core/playwright@4.10.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Use SPA-safe navigation readiness in production QA
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const files = [
            "scripts/full-production-qa.mjs",
            "scripts/full-product-qa-v2.mjs",
            "scripts/full-product-qa-gate.mjs",
            "scripts/connected-grc-production-qa.mjs",
          ];

          let replacements = 0;
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const source = fs.readFileSync(file, "utf8");
            const matches = source.match(/waitUntil:\s*["']networkidle["']/g) || [];
            if (!matches.length) continue;
            const updated = source.replace(/waitUntil:\s*["']networkidle["']/g, 'waitUntil: "domcontentloaded"');
            fs.writeFileSync(file, updated);
            replacements += matches.length;
            console.log(`SPA readiness: ${file} (${matches.length} navigation${matches.length === 1 ? "" : "s"})`);
          }

          if (!replacements) {
            throw new Error("No networkidle navigation waits were found in production QA scripts; review the readiness normalizer.");
          }
          console.log(`SPA readiness normalized ${replacements} navigation wait(s).`);
          NODE

      - name: Run legacy production QA baseline
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Legacy production QA attempt ${attempt}/3"
            node scripts/full-production-qa.mjs
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Legacy QA failed with exit ${status}; waiting 15s before retrying transient production navigation."
              sleep 15
            fi
          done
          exit "$status"

      - name: Run bilingual full-product QA and production gate
        run: node scripts/full-product-qa-gate.mjs

      - name: Validate Connected GRC live-source graph
        run: node scripts/connected-grc-production-qa.mjs

      - name: Upload QA reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fornost-full-production-qa
          path: |
            qa-artifacts/
            qa-artifacts-v2/
          if-no-files-found: warn
          retention-days: 21
