name: External assurance browser QA
on:
  pull_request:
    paths:
      - 'app/exchange/**'
      - 'app/api/exchange/**'
      - 'app/api/public-exchange/**'
      - 'app/vendor-portal/**'
      - 'app/trust-center/**'
      - 'app/board-pack/**'
      - 'scripts/external-assurance-qa.mjs'
      - 'scripts/external-assurance-qa-fixture.mjs'
      - '.github/workflows/external-assurance-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enterprise-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npm run build
      - name: Verify external assurance on an isolated D1
        shell: bash
        run: |
          set -euo pipefail
          export ENTERPRISE_BOOTSTRAP_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$ENTERPRISE_BOOTSTRAP_KEY"
          umask 077
          printf 'FORNOST_SETTINGS_ENCRYPTION_KEY="isolated-qa-encryption-key-no-customer-data"\nFORNOST_BOOTSTRAP_TOKEN="%s"\n' "$ENTERPRISE_BOOTSTRAP_KEY" > dist/server/.dev.vars
          node_modules/.bin/wrangler d1 migrations apply fornost-grc-prod --local --config wrangler.d1.jsonc >/tmp/core-migration.log
          node scripts/external-assurance-qa-fixture.mjs > /tmp/external-fixture.sql
          node_modules/.bin/wrangler d1 execute fornost-grc-prod --local --config wrangler.d1.jsonc --file=/tmp/external-fixture.sql >/dev/null
          node_modules/.bin/vite preview --host 127.0.0.1 --port 4184 --strictPort >/tmp/core-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; rm -f dist/server/.dev.vars' EXIT
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:4184/api/auth -o /dev/null 2>/dev/null; then break; fi
            if ! kill -0 "$server" 2>/dev/null; then tail -35 /tmp/core-server.log; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4184/api/auth -o /dev/null
          QA_CHROMIUM_PATH="$(command -v google-chrome)" xvfb-run -a node scripts/external-assurance-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-stakeholder-browser
          path: external-stakeholder-qa-artifacts/
