name: Temporary production QA identity
description: Creates a random per-run QA account and removes it and its sessions in the post step.
inputs:
  token:
    required: true
    description: Existing scoped production D1 token
  account:
    required: true
    description: Cloudflare account ID
runs:
  using: node24
  main: index.mjs
  post: cleanup.mjs
  post-if: always()
