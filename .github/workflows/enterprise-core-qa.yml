name: Enterprise Core browser QA
on:
  pull_request:
    paths:
      - 'app/enterprise/**'
      - 'app/api/enterprise/**'
      - 'app/api/scim/**'
      - 'scripts/enterprise-core-qa.mjs'
      - '.github/workflows/enterprise-core-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enterprise-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Verify Enterprise Core on an isolated D1
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply fornost-grc-prod --local --config wrangler.d1.jsonc >/tmp/core-migration.log
          npm run dev -- --host 127.0.0.1 --port 4184 --strictPort >/tmp/core-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..120}; do if curl -fsS http://127.0.0.1:4184/api/health >/dev/null 2>&1; then break; fi; sleep 1; done
          QA_CHROMIUM_PATH="$(command -v google-chrome)" xvfb-run -a node scripts/enterprise-core-qa.mjs
