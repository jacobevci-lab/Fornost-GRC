name: One-time Semgrep Parser Remediation

on:
  push:
    branches:
      - qa/full-product-security-audit-2026-09-22
    paths:
      - .github/workflows/qa-semgrep-parser-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: qa/full-product-security-audit-2026-09-22
          fetch-depth: 0

      - name: Remove JSX parser gaps and fail closed on every Semgrep parser error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              "app/executive-assurance-panel.tsx": [
                  ("<small>DELIVERY & SLA</small>", "<small>DELIVERY &amp; SLA</small>"),
              ],
              "app/fornost-ai-copilot.tsx": [
                  (">YÖNETİŞİM & GÜVENCE</small>", ">YÖNETİŞİM &amp; GÜVENCE</small>"),
                  (">OPERASYON & SİSTEM</small>", ">OPERASYON &amp; SİSTEM</small>"),
              ],
              "app/fornost-ai-knowledge.tsx": [
                  (">İçerik & Geçmiş</button>", ">İçerik &amp; Geçmiş</button>"),
              ],
              "app/fornost-ai-lifecycle.tsx": [
                  ("<small>MODEL OPS · CHANGE & DRIFT</small>", "<small>MODEL OPS · CHANGE &amp; DRIFT</small>"),
                  (">Monitoring & Drift</button>", ">Monitoring &amp; Drift</button>"),
              ],
              "app/risk-appetite.tsx": [
                  ("<small>FORNOST RISK APPETITE & KRI</small>", "<small>FORNOST RISK APPETITE &amp; KRI</small>"),
              ],
          }

          changed = 0
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected exactly one occurrence in {file_name}: {old!r}; found {count}")
                  text = text.replace(old, new, 1)
                  changed += 1
              path.write_text(text)

          workflow = Path(".github/workflows/full-security-audit.yml")
          text = workflow.read_text()
          allowlist_pattern = re.compile(
              r"          accepted_partial_paths=\{\n(?:            .*\n)+?          \}\n",
              re.MULTILINE,
          )
          text, count = allowlist_pattern.subn("          accepted_partial_paths=set()\n", text, count=1)
          if count != 1:
              raise SystemExit(f"Expected one Semgrep partial-parse allowlist block; replaced {count}")
          old_gate = "          raise SystemExit(2 if high or unexpected else 0)"
          new_gate = "          raise SystemExit(2 if high or errors else 0)"
          if text.count(old_gate) != 1:
              raise SystemExit("Semgrep fail-closed gate marker was not found exactly once")
          text = text.replace(old_gate, new_gate, 1)
          workflow.write_text(text)

          if changed != 7:
              raise SystemExit(f"Expected 7 JSX parser remediations; applied {changed}")
          if any(name in text for name in replacements):
              raise SystemExit("A parser allowlist path remains in the security workflow")
          print(f"Applied {changed} JSX parser remediations and removed the Semgrep parser allowlist")
          PY

      - name: Commit remediation
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/executive-assurance-panel.tsx app/fornost-ai-copilot.tsx app/fornost-ai-knowledge.tsx app/fornost-ai-lifecycle.tsx app/risk-appetite.tsx .github/workflows/full-security-audit.yml
          git commit -m "security: close Semgrep partial parsing coverage gap"
          git push origin HEAD:qa/full-product-security-audit-2026-09-22
